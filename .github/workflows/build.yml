name: Build and test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout (with the PcmHammer submodule)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore PcmSuite.sln

      - name: Build
        run: dotnet build PcmSuite.sln --configuration Release --no-restore

      # Tests that need real BIN or XDF files skip themselves when those (uncommitted) files are absent.
      - name: Test
        run: dotnet test PcmSuite.sln --configuration Release --no-build --verbosity normal

  # Linux builds the app and the tests directly. PcmSuite.sln also lists PCM Hammer's own projects, which target Android too
  # and would need the Android SDK.
  linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with the PcmHammer submodule)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Build the app
        run: dotnet build src/PcmSuite.Desktop --configuration Release

      - name: Build the standalone Tuner
        run: dotnet build src/PcmSuite.Tuner.Desktop --configuration Release

      - name: Build the tests
        run: dotnet build tests/PcmSuite.Tests --configuration Release

      - name: Test
        run: dotnet test tests/PcmSuite.Tests --configuration Release --no-build --verbosity normal
